name = "coralnest"
main = "src/lib/cloudflare/worker.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# ---------------------------------------------------------------------------
# Cloudflare D1 Database (5 GB Free Serverless SQL)
# ---------------------------------------------------------------------------
[[d1_databases]]
binding = "CORALNEST_DB"
database_name = "coralnest-db"
database_id = "your-d1-database-id"

# ---------------------------------------------------------------------------
# Cloudflare R2 Storage (10 GB Free Raw Scraped Files & Bundles)
# ---------------------------------------------------------------------------
[[r2_buckets]]
binding = "CORALNEST_STORAGE"
bucket_name = "coralnest-scraped-data"

# ---------------------------------------------------------------------------
# Cloudflare Vectorize (Free AI Vector Embeddings Index)
# ---------------------------------------------------------------------------
[[vectorize]]
binding = "CORALNEST_VECTORS"
index_name = "coralnest-vectors"
